
<!DOCTYPE html>
<html>

    <style>
        body {

        header {

            align-items: center;

        header h1 {
            margin: 0;

        nav a {
            background-color: green;

            border-radius: 12px;
            font-size: 20px;
        }

        main {
    display: flex;
    min-height: calc(100vh - 103px);
}

        aside {
            background-color: #99ff99;
            width: 20%;
            padding: 12px;
        }

        aside h1 {
            background-color: blue;
            color: #a18eff;
            text-align: center;
        }

        section {
            background-color: #d98299;
            flex: 1;
            padding: 12px;
        }

</head>

<body>

    <header>
        <h1>TechShop</h1>

        <nav>
            <a href="#">Mis Autos</a>

    <main>
